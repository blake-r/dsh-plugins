# @blake-r/dsh-spill-policy bundle patch.
# Declaring `dsh.bundle` in package.json makes `dsh plugin add` treat this
# package as a profile layer: it is added to `dsh.profile.bundles`
# automatically and this patch is applied as a layer. The user's profile
# patch is applied after this bundle, so per-profile overrides still win.

# This package is the deployment's replacement spill policy: the base
# @deepseek-ai/dsh-spill-policy row (maxInlineTokens=12500) is disabled here
# and the tighter replacement row is inserted with an explicit byte cap. The
# remaining defaults live in the plugin code (headLines=2, tailLines=1,
# excludeTools read/skill/recall). A profile patch applied after this bundle
# layer can still override the values.
#
# maxInlineBytes=16384 is the deployment's "4K tokens" budget expressed in
# bytes under the token-meter heuristic density (CHARS_PER_TOKEN=4): 4096
# tokens * 4 chars = 16384 bytes. The policy itself is byte-based, so for
# non-ASCII text (Cyrillic, CJK) this admits fewer than 4096 tokens.
#
# Do not raise it back to 131072 (32K tokens): the local subprocess runtime caps
# one bash stream at ~120 KB, so a higher threshold makes bash results
# unreachable for this policy — they get truncated into a temp file instead of
# spilling, and only tools without their own cap (grep, glob, MCP, subagents)
# ever spill.
#
# Oversized results are written to a file under the session's own directory
# (<sessionDir>/spill/), next to session.jsonl.zstd, and the model-facing result
# becomes a hint carrying that absolute path plus a head/tail preview. Nothing
# is appended to the session log: agents read the artifact with `read` or parse
# it with bash and any script.
- id: spill-policy
  disabled: true

- insert:
    - id: spill-policy-replacement
      name: '@blake-r/dsh-spill-policy'
      config:
        maxInlineBytes: 16384